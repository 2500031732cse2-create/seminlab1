<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            margin: 0;
        }
        header {
            background: #243b70;
            color: white;
            padding: 25px;
        }
        .container {
            margin: 50px auto;
            max-width: 650px;
            padding: 25px;
        }
        .card {
            background: white;
            display: inline-block;
            width: 220px;
            padding: 25px 10px;
            margin: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }
        a {
            display: inline-block;
            background: #2864dc;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 6px;
        }
        a:hover { background: #173b91; }
    </style>
</head>
<body>
    <header>
        <h1>Student Attendance Management System</h1>
        <p>Manage and monitor attendance easily</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Admin Module</h2>
            <p>View student attendance records.</p>
            <a href="admin.html">Admin Dashboard</a>
        </div>

        <div class="card">
            <h2>Student Module</h2>
            <p>Check your attendance details.</p>
            <a href="user.html">Student Dashboard</a>
        </div>
    </div>

    <footer>
        <p>© 2026 Student Attendance System</p>
    </footer>
</body>
</html>
